<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LinkedIn Thought Leader Generator | Syntax Toys</title>

<style>
body{
  background:black;
  color:#00ff66;
  font-family:monospace;
  padding:40px;
  line-height:1.5;
}

button{
  margin-top:10px;
  margin-right:10px;
  background:black;
  color:#00ff66;
  border:1px solid #00ff66;
  padding:8px 14px;
  font-family:monospace;
  cursor:pointer;
}

button:hover{
  background:#001a0a;
}

#output{
  margin-top:24px;
  padding:16px;
  border:1px solid #00ff66;
  min-height:120px;
  max-width:720px;
  white-space:pre-wrap;
}

a{
  color:#b366ff;
}
</style>
</head>

<body>

<h1>LinkedIn Thought Leader Generator</h1>

<p>Generate a reflective professional insight.</p>

<button onclick="generate()">Generate</button>
<button onclick="copyText()">Copy</button>

<div id="output">Click generate.</div>

<p><a href="index.html">Back to Syntax Toys</a></p>

<script>

const openings = [
"Something I’ve been thinking about lately:",
"A quick reflection from this week:",
"One lesson that keeps coming back:",
"An observation from recent conversations:",
"A thought I wanted to share today:"
];

const middles = [
"The future of AI isn’t about replacing people.",
"Leadership is less about control and more about clarity.",
"The best teams optimize for trust, not speed.",
"Innovation often comes from small consistent improvements.",
"Technology alone never solves organizational problems."
];

const twists = [
"It’s about how we empower people to do their best work.",
"It’s about creating environments where good decisions happen naturally.",
"It’s about understanding the human side of systems.",
"It’s about building culture alongside technology.",
"It’s about designing processes that scale."
];

const endings = [
"Curious how others are thinking about this.",
"Would love to hear different perspectives.",
"Still learning every day.",
"Just something I’m reflecting on.",
"Interested in how others see it."
];

function pick(arr){
return arr[Math.floor(Math.random()*arr.length)];
}

function generate(){

const text =
pick(openings) + "\n\n" +
pick(middles) + " " +
pick(twists) + "\n\n" +
pick(endings);

document.getElementById("output").textContent=text;

}

function copyText(){

const text=document.getElementById("output").textContent;
navigator.clipboard.writeText(text);

}

</script>

</body>
</html>
