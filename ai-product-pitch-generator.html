<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Product Pitch Generator | Syntax Toys</title>

<style>
body{
  background:black;
  color:#00ff66;
  font-family:monospace;
  padding:40px;
}

button{
  margin-top:10px;
  margin-right:10px;
  background:black;
  color:#00ff66;
  border:1px solid #00ff66;
  padding:8px 14px;
  font-family:monospace;
  cursor:pointer;
}

button:hover{
  background:#001a0a;
}

#output{
  margin-top:24px;
  padding:16px;
  border:1px solid #00ff66;
  min-height:60px;
  max-width:720px;
  white-space:pre-wrap;
}

a{
  color:#b366ff;
}
</style>
</head>

<body>

<h1>AI Product Pitch Generator</h1>

<p>Generate an irresistible AI startup pitch.</p>

<button onclick="generate()">Generate</button>
<button onclick="copyText()">Copy</button>

<div id="output">Click generate.</div>

<p><a href="index.html">Back to Syntax Toys</a></p>

<script>

const openings = [
"Our AI-powered platform",
"Our next-generation solution",
"Our machine learning engine",
"Our intelligent workflow system",
"Our cutting-edge AI product"
];

const actions = [
"helps teams automate repetitive tasks",
"transforms raw data into actionable insight",
"streamlines enterprise decision-making",
"unlocks new efficiencies across operations",
"redefines how organizations handle knowledge work"
];

const methods = [
"using advanced large language models",
"through proprietary neural infrastructure",
"with real-time multimodal analysis",
"via scalable automation pipelines",
"through adaptive intelligence at enterprise scale"
];

const closings = [
"So your team can focus on what matters most.",
"Without adding operational overhead.",
"All within a seamless user experience.",
"At the speed modern business demands.",
"Built for the future of work."
];

function pick(arr){
return arr[Math.floor(Math.random()*arr.length)];
}

function generate(){

const text =
pick(openings) + " " +
pick(actions) + " " +
pick(methods) + ". " +
pick(closings);

document.getElementById("output").textContent=text;

}

function copyText(){

const text=document.getElementById("output").textContent;
navigator.clipboard.writeText(text);

}

</script>

</body>
</html>
