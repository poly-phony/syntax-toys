<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stack Overflow Answer Generator | Syntax Toys</title>

<style>
body{
  background:black;
  color:#00ff66;
  font-family:monospace;
  padding:40px;
  line-height:1.5;
}

button{
  margin-top:10px;
  margin-right:10px;
  background:black;
  color:#00ff66;
  border:1px solid #00ff66;
  padding:8px 14px;
  font-family:monospace;
  cursor:pointer;
}

button:hover{
  background:#001a0a;
}

#output{
  margin-top:24px;
  padding:16px;
  border:1px solid #00ff66;
  min-height:120px;
  max-width:720px;
  white-space:pre-wrap;
}

a{
  color:#b366ff;
}
</style>
</head>

<body>

<h1>Stack Overflow Answer Generator</h1>

<p>Generate a helpful (and slightly confident) developer answer.</p>

<button onclick="generate()">Generate</button>
<button onclick="copyText()">Copy</button>

<div id="output">Click generate.</div>

<p><a href="index.html">Back to Syntax Toys</a></p>

<script>

const openings = [
"This usually happens when",
"In most cases this issue is caused by",
"You’re likely running into",
"This error typically appears when",
"This behavior often occurs if"
];

const problems = [
"the environment variable isn't loaded correctly",
"a dependency version mismatch exists",
"the service wasn't restarted after configuration changes",
"the cache still contains stale data",
"the runtime is using a different configuration"
];

const fixes = [
"Try restarting the service.",
"Make sure the configuration file is being loaded.",
"Clear the cache and run the build again.",
"Check your environment variables.",
"Verify that the correct dependency version is installed."
];

const closings = [
"That should resolve the issue.",
"Let me know if that helps.",
"This fixed it for me.",
"Hope that points you in the right direction.",
"You might also want to double-check the logs."
];

function pick(arr){
return arr[Math.floor(Math.random()*arr.length)];
}

function generate(){

const text =
pick(openings) + " " +
pick(problems) + ". " +
pick(fixes) + " " +
pick(closings);

document.getElementById("output").textContent=text;

}

function copyText(){

const text=document.getElementById("output").textContent;
navigator.clipboard.writeText(text);

}

</script>
</body>
</html>
